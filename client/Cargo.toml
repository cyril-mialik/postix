[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
postix-core = { workspace = true }
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
gloo-net = { version = "0.6", features = ["http"] }
gloo-utils = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
web-sys = { version = "0.3", features = [
  "Window",
  "Storage",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
] }
[profile.release]
opt-level = "s"
lto = true
