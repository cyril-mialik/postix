[workspace]
members = ["server", "client"]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.7", features = [
  "runtime-tokio-native-tls",
  "postgres",
  "chrono",
  "uuid",
  "migrate",
] }
tokio = { version = "1", features = ["full"] }
actix-web = "4"
dotenvy = "0.15.7"
actix-cors = "0.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
argon2 = "0.5"
password-hash = "0.5"
futures-util = "0.3.34"
deadpool-redis = { version = "0.22", features = ["rt_tokio_1"] }
redis = { version = "0.32", features = ["tokio-comp", "aio"] }
cookie = "0.18.2"
async-trait = "0.1.92"
